name: Verify Cloudflare Workers trial

on:
  push:
    branches:
      - hosting/cloudflare-workers-trial
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloudflare:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'hosting/cloudflare-workers-trial'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Cloudflare Worker
        run: bun run build:cloudflare

      - name: Verify generated Worker entry and asset binding
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const configPath = ".output/server/wrangler.json";
          const entryPath = ".output/server/index.mjs";

          if (!fs.existsSync(entryPath)) {
            throw new Error("Nitro did not generate .output/server/index.mjs");
          }
          if (!fs.existsSync(configPath)) {
            throw new Error("Nitro did not generate .output/server/wrangler.json");
          }

          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          if (!config.main || !config.main.endsWith("index.mjs")) {
            throw new Error("Wrangler config does not point to the generated Worker entry");
          }
          if (!config.assets?.binding || !config.assets?.directory) {
            throw new Error("Wrangler config is missing the static asset binding");
          }
          const assetDirectory = path.resolve(".output/server", config.assets.directory);
          if (!fs.existsSync(assetDirectory)) {
            throw new Error(`Static asset directory does not exist: ${assetDirectory}`);
          }

          console.log("Cloudflare Worker entry and static asset binding are present.");
          NODE

      - name: Validate Wrangler deployment bundle without publishing
        run: bunx wrangler --cwd .output/server deploy --dry-run
