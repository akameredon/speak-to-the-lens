name: Verify Teleprompter

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Lint changed product files
        run: >-
          bunx eslint
          src/components/tp/Teleprompter.tsx
          src/components/tp/useSpeech.ts
          src/lib/store.ts
          src/routes/api/script.ts
          src/routes/api/delivery.ts
          src/lib/delivery.ts
          src/test/delivery.test.ts
          src/test/store.test.ts
          src/test/follow.test.ts
          --rule 'prettier/prettier: off'

      - name: Build for production
        run: bun run build
